<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- White Circular Badge Background -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#007DFE" stroke-width="6"/>
  
  <!-- Stylized Modern Jeepney / Transport Cooperative Vector in GCash Blue -->
  <g transform="translate(42, 38) scale(0.58)">
    <!-- Roof & Carrier -->
    <path d="M20 50 Q100 35 180 50" stroke="#007DFE" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="35" y="38" width="130" height="12" rx="4" fill="#007DFE"/>
    
    <!-- Windshield -->
    <path d="M30 60 L170 60 L160 100 L40 100 Z" fill="#E8F2FF" stroke="#007DFE" stroke-width="7" stroke-linejoin="round"/>
    <line x1="100" y1="60" x2="100" y2="100" stroke="#007DFE" stroke-width="5"/>
    
    <!-- Grille & Headlights -->
    <rect x="25" y="100" width="150" height="55" rx="8" fill="#FFFFFF" stroke="#007DFE" stroke-width="7"/>
    <!-- Grille bars -->
    <line x1="75" y1="108" x2="75" y2="145" stroke="#007DFE" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="108" x2="90" y2="145" stroke="#007DFE" stroke-width="5" stroke-linecap="round"/>
    <line x1="105" y1="108" x2="105" y2="145" stroke="#007DFE" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="108" x2="120" y2="145" stroke="#007DFE" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Left & Right Headlights -->
    <circle cx="45" cy="120" r="10" fill="#E8F2FF" stroke="#007DFE" stroke-width="5"/>
    <circle cx="155" cy="120" r="10" fill="#E8F2FF" stroke="#007DFE" stroke-width="5"/>
    
    <!-- Bumper -->
    <rect x="15" y="152" width="170" height="14" rx="6" fill="#007DFE"/>
    
    <!-- Wheels -->
    <rect x="30" y="165" width="28" height="20" rx="6" fill="#0056B3"/>
    <rect x="142" y="165" width="28" height="20" rx="6" fill="#0056B3"/>
  </g>

  <!-- Micro Brand Text Under Icon -->
  <text x="100" y="166" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#007DFE" text-anchor="middle" letter-spacing="1">GPasada</text>
</svg>
